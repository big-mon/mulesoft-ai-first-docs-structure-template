schemaVersion: "1.0"

application:
  appId: sample-domain-api-v1
  appName: サンプルドメインAPIアプリケーション
  artifactName: sample-domain-api-v1.jar
  deploymentUnit: jar
  repository: sample-domain-api-v1
  muleRuntime: "4.x"
  ownerTeam: integration-team

documents:
  basicDesign: docs/application-basic-design.md
  detailDesign: docs/application-detail-design.md

common:
  errorModel: common/raml/types/ErrorResponse.raml
  commonTraits:
    - common/raml/traits/correlation-id.raml
    - common/raml/traits/common-errors.raml

apis:
  - apiId: sample-customer-api-v1
    apiFolder: sample-customer-api
    apiName: サンプル顧客API
    version: v1
    apiLayer: Experience
    description: 顧客情報の参照・検索を提供するサンプルAPI。
    rootRaml: apis/sample-customer-api/raml/sample-customer-api.raml
    basePath: /api/v1
    entryFlow: sample-customer-api-main-flow
    apiKitConfig: sample-customer-api-config
    lifecycle:
      requirementStatus: draft
      basicDesignStatus: draft
      detailDesignStatus: not_started
    autodiscovery:
      enabled: true
      apiIdProperty: api.sampleCustomer.instanceId
      flowRef: sample-customer-api-main-flow
    apiManager:
      managed: true
      policies:
        - client-id-enforcement
        - rate-limiting
      consumers:
        - sample-web-frontend
    operations:
      - operationId: sample-customer-api-v1.customer.getById
        method: GET
        path: /customers/{customerId}
        summary: 顧客IDを指定して顧客情報を取得する。
        operationFolder: get-customer-by-id
        raml: apis/sample-customer-api/operations/get-customer-by-id/get-customer-by-id.raml
        flow: get-customer-by-id-flow
        requestType: null
        requestHeaders:
          - name: client_id
            required: true
            source: Client ID enforcement
            constraints:
              pattern: "^[A-Za-z0-9_-]{16,64}$"
          - name: client_secret
            required: true
            source: Client ID enforcement
            constraints:
              minLength: 32
        responseType: Customer
        errorModel: ErrorResponse
        dataweave:
          response: src/main/resources/dwl/customer-get-by-id-response.dwl
        munit:
          - customer-get-by-id-success-test
          - customer-get-by-id-validation-error-test
          - customer-get-by-id-not-found-test
          - customer-get-by-id-timeout-test
        lifecycle:
          requirementStatus: draft
          basicDesignStatus: draft
          detailDesignStatus: not_started

      - operationId: sample-customer-api-v1.customer.search
        method: POST
        path: /customers/search
        summary: 条件を指定して顧客情報を検索する。
        operationFolder: post-customer-search
        raml: apis/sample-customer-api/operations/post-customer-search/post-customer-search.raml
        flow: search-customers-flow
        requestType: CustomerSearchRequest
        responseType: CustomerSearchResponse
        errorModel: ErrorResponse
        dataweave:
          request: src/main/resources/dwl/customer-search-request.dwl
          response: src/main/resources/dwl/customer-search-response.dwl
        munit:
          - customer-search-success-test
          - customer-search-validation-error-test
          - customer-search-system-error-test
        lifecycle:
          requirementStatus: draft
          basicDesignStatus: draft
          detailDesignStatus: not_started
