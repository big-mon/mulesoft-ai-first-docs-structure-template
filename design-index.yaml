schemaVersion: "1.0"

repository:
  repositoryId: mulesoft-ai-first-docs-structure-template
  description: MuleSoftアプリケーション設計資産を複数アプリケーション単位で管理するテンプレート。
  applicationRoot: applications

structure:
  applicationPathPattern: applications/{appId}
  commonRamlPathPattern: applications/{appId}/raml/common
  apiPathPattern: applications/{appId}/raml/{apiFolder}/{version}
  operationPathPattern: applications/{appId}/raml/{apiFolder}/{version}/resources/{operationRaml}
  appDesignIndexFile: applications/{appId}/design-index.yaml

applications:
  - appId: sample-domain-api-v1
    appName: サンプルドメインAPIアプリケーション
    artifactName: sample-domain-api-v1.jar
    deploymentUnit: jar
    root: applications/sample-domain-api-v1
    designIndex: applications/sample-domain-api-v1/design-index.yaml
    pom: applications/sample-domain-api-v1/pom.xml
    apis:
      - apiId: sample-customer-api-v1
        apiFolder: sample-customer-api
        version: v1
