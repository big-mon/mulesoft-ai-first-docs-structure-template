schemaVersion: "1.0"

repository:
  repositoryId: mulesoft-ai-first-docs-structure-template
  description: MuleSoftアプリケーション設計資産を複数アプリケーション単位で管理するテンプレート。
  applicationRoot: applications

structure:
  applicationPathPattern: applications/{appId}
  apiPathPattern: applications/{appId}/apis/{apiId}
  operationPathPattern: applications/{appId}/apis/{apiId}/operations/{operationFolder}
  appDesignIndexFile: applications/{appId}/design-index.yaml

applications:
  - appId: sample-domain-api
    appName: サンプルドメインAPIアプリケーション
    artifactName: sample-domain-api.jar
    deploymentUnit: jar
    root: applications/sample-domain-api
    designIndex: applications/sample-domain-api/design-index.yaml
    pom: applications/sample-domain-api/pom.xml
    apis:
      - sample-customer-api-v1
      - sample-address-api-v1
